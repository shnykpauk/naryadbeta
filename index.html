<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Учёт нарядов</title>
<style>
:root{--bg:#f3f4fb;--card:#fff;--tx:#1b1f3b;--mut:#6b7090;--ac:#5b5bf0;--ac2:#8b5cf6;--ok:#10b981;--warn:#f59e0b;--bd:#e4e6f2;--chip:#eceeff;--bad:#ef4444;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1224;--card:#1a1e38;--tx:#eceefb;--mut:#9aa0c8;--bd:#2b3050;--chip:#272c52;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f1224;--card:#1a1e38;--tx:#eceefb;--mut:#9aa0c8;--bd:#2b3050;--chip:#272c52;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.wrap{max-width:1000px;margin:0 auto;padding:16px}
.hero{background:linear-gradient(135deg,var(--ac),var(--ac2));color:#fff;border-radius:20px;padding:24px;margin-bottom:20px}
.hero h1{margin:0 0 4px;font-size:26px}.hero p{margin:0;opacity:.85}
.stats{display:flex;gap:12px;flex-wrap:wrap;margin-top:18px}
.st{background:rgba(255,255,255,.18);border-radius:14px;padding:10px 16px;min-width:120px}
.st b{display:block;font-size:22px}.st span{font-size:12px;opacity:.85}
.mode{display:inline-block;margin-top:14px;padding:4px 12px;border-radius:99px;background:rgba(255,255,255,.22);font-size:13px}
h2{font-size:18px;margin:26px 0 4px}.sub{color:var(--mut);margin:0 0 12px;font-size:13px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.cand{background:var(--card);border:1px solid var(--bd);border-left:5px solid var(--ok);border-radius:14px;padding:12px 14px}
.cand .n{font-weight:700}.cand .r{font-size:12px;color:var(--mut);margin-top:4px}.cand .k{font-size:11px;color:var(--ok);font-weight:700}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;overflow-x:auto}
table{width:100%;border-collapse:collapse;min-width:560px}
th{font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--mut);text-align:left;padding:10px 14px;border-bottom:1px solid var(--bd)}
td{padding:9px 14px;border-bottom:1px solid var(--bd)}tr:last-child td{border-bottom:0}
.bar{height:8px;border-radius:9px;background:var(--chip);min-width:70px}.bar i{display:block;height:100%;border-radius:9px;background:linear-gradient(90deg,var(--ac),var(--ac2))}
.cnt{display:flex;align-items:center;gap:8px}.cnt b{min-width:18px}
.tag{font-size:12px;padding:2px 10px;border-radius:99px;background:var(--chip);color:var(--mut);white-space:nowrap}
.tag.x{background:rgba(239,68,68,.14);color:var(--bad)}.tag.p{background:rgba(245,158,11,.16);color:var(--warn)}
.dts{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
.dt{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:12px}
.dt.nx{border-color:var(--ac);box-shadow:0 0 0 2px rgba(91,91,240,.2)}.dt.ps{opacity:.92}
.dt h4{margin:0 0 8px;font-size:14px;display:flex;justify-content:space-between;gap:6px}
.chip{display:inline-block;background:var(--chip);border-radius:99px;padding:3px 10px;margin:0 4px 4px 0;font-size:13px}
.em{color:var(--mut);font-size:13px}
button{font:inherit;cursor:pointer;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:10px;padding:4px 10px}
button.on{background:var(--ac);border-color:var(--ac);color:#fff}
button.ed{font-size:12px;padding:2px 8px}
.pick{margin-top:8px;display:flex;flex-wrap:wrap;gap:5px}.pick button{font-size:12px;padding:3px 8px}.pick button[disabled]{opacity:.35;cursor:default}
.save{position:sticky;bottom:12px;margin-top:20px;background:var(--ac);color:#fff;padding:12px 16px;border-radius:14px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.save button{background:#fff;color:var(--ac);border:0;font-weight:700}
@media(max-width:560px){.hero h1{font-size:22px}}

.in{font:inherit;padding:5px 10px;border:1px solid var(--bd);border-radius:10px;background:var(--card);color:var(--tx)}a{color:var(--mut)}.ok{color:#fff}
</style></head><body><div class="wrap"><div id="app"></div></div>
<script>
let S=null;const LS=localStorage,M=['янв','фев','мар','апр','мая','июн','июл','авг','сен','окт','ноя','дек'];
let owner=!!LS.getItem('duty_token'),dirty=false,openD=null,saving=false,err='',ok='';
const fmt=d=>{const p=d.split('-');return +p[2]+' '+M[p[1]-1]};
const wd=d=>['Вс','Пн','Вт','Ср','Чт','Пт','Сб'][new Date(d).getUTCDay()];
const nw=new Date(),today=nw.getFullYear()+'-'+String(nw.getMonth()+1).padStart(2,'0')+'-'+String(nw.getDate()).padStart(2,'0');
const ago=d=>Math.round((Date.parse(today)-Date.parse(d))/864e5);
const getDates=()=>{const a=[];for(let t=Date.parse(S.start);t<=Date.parse(S.end);t+=6048e5)a.push(new Date(t).toISOString().slice(0,10));return a};
function calc(){const st={};S.people.forEach(p=>st[p.n]={c0:0,c:0,l0:null,l:null,p:null});
for(const d of Object.keys(S.duty).sort())S.duty[d].forEach(nm=>{const o=st[nm];if(!o)return;if(d<=today){o.c0++;o.l0=d}else if(!o.p)o.p=d});
S.people.forEach(p=>{const o=st[p.n];o.c=Math.max(0,o.c0+(p.b||0));o.l=o.l0||p.ol||null});return st}
/* старый формат: oc/ol перекрывали график, поэтому правки старых нарядов ни на что не влияли.
   oc -> поправка b (добавляется к подсчёту по графику), ol остаётся только если по графику человек ещё не ходил */
function migrate(){const st=calc();S.people.forEach(p=>{const o=st[p.n];
if(p.oc!=null){const b=p.oc-o.c0;if(b)p.b=b;else delete p.b;delete p.oc}
if(p.ol!=null&&(o.l0||!p.ol))delete p.ol})}
const DZ_END='2026-12-24';let openZ=null;
const dzDates=()=>getDates().filter(d=>d>today&&d<=DZ_END);
function render(){
const app=document.getElementById('app');if(!S){app.textContent='Загрузка…';return}
const dates=getDates(),ppl=S.people,st=calc();
const next=dates.find(d=>d>today),max=Math.max(1,...Object.values(st).map(o=>o.c)),total=Object.values(st).reduce((a,o)=>a+o.c,0),elig=ppl.filter(p=>!p.ex).length,nd=S.duty[next]||[];
const cands=ppl.filter(p=>!p.ex&&!nd.includes(p.n)).map((p,i)=>({p,s:st[p.n],i})).sort((a,b)=>a.s.c-b.s.c||(a.s.l||'').localeCompare(b.s.l||'')||a.i-b.i).slice(0,6);
let h=`<h2 style="margin-bottom:12px">Кандидаты на ближайший наряд</h2><div class="grid">`;
cands.forEach((x,k)=>{h+=`<div class="cand"><div class="k">№${k+1}</div><div class="n">${x.p.n}</div><div class="r">${x.s.l?'Нарядов: '+x.s.c+' · был '+fmt(x.s.l)+' ('+ago(x.s.l)+' дн. назад)':'Ещё ни разу не ходил'}</div></div>`});
h+=`</div><h2>Весь список</h2><p class="sub">Фамилия, последний наряд и количество нарядов</p><div class="card"><table><tr><th>№</th><th>Фамилия, инициалы</th><th>Последний наряд</th><th>Нарядов<div style="font-size:11px;font-weight:400;text-transform:none;letter-spacing:0;max-width:190px;margin-top:2px">Количество нарядов ведется за текущий семестр, а не общее количество</div></th></tr>`;
ppl.forEach((p,i)=>{const s=st[p.n];
const tag=p.ex?'<span class="tag x">Не назначается</span>':s.p?'<span class="tag p">Назначен '+fmt(s.p)+'</span>':'<span class="tag">Доступен</span>';
h+=`<tr><td>${i+1}</td><td><b>${p.n}</b>${owner?' <button class="ed" data-a="del" data-i="'+i+'">✕</button>':''}</td><td>${owner?'<input class="in" type="date" max="'+today+'" data-f="ol" data-i="'+i+'" value="'+(s.l||'')+'">':(s.l?fmt(s.l)+' <span class="em">('+ago(s.l)+' дн.)</span>':'<span class="em">не ходил</span>')}</td><td>${owner?'<input class="in" type="number" min="0" style="width:64px" data-f="oc" data-i="'+i+'" value="'+s.c+'">'+(p.b?' <span class="em" title="Ручная поправка к подсчёту по графику">по графику: '+s.c0+'</span>':''):'<b>'+s.c+'</b>'}</td></tr>`});
h+='</table></div>';
if(owner)h+='<p style="margin-top:10px"><input class="in" id="np" placeholder="Фамилия И.О."> <button data-a="add">Добавить человека</button></p>';
h+=`<h2 style="margin-bottom:12px">График нарядов</h2><div class="dts">`;
const card=d=>{const l=S.duty[d]||[];let c=`<div class="dt ${d===next?'nx':''}"><h4><span>${wd(d)}, ${fmt(d)}</span><span class="em">${d===next?'ближайший':''}</span></h4>${l.length?l.map(n=>'<span class="chip">'+n+'</span>').join(''):'<span class="em">никто не назначен</span>'}${owner?'<div><button class="ed" data-a="open" data-d="'+d+'">'+(openD===d?'Закрыть':'Изменить')+'</button></div>':''}`;
if(owner&&openD===d)c+='<div class="pick">'+ppl.map((p,i)=>`<button class="${l.includes(p.n)?'on':''}" ${p.ex?'disabled':''} data-a="tog" data-d="${d}" data-i="${i}">${p.n}</button>`).join('')+'</div>';
return c+'</div>'};
dates.filter(d=>d>today).forEach(d=>h+=card(d));
h+='</div>';
h+=`<h2>Ранее ходили в наряд</h2><p class="sub">Прошедшие наряды, от последнего к первому</p><div class="dts">`+[...new Set([...dates.filter(d=>d<=today),...Object.keys(S.duty).filter(d=>d<=today)])].sort().reverse().map(card).join('')+'</div>';
h+=`<h2>Дежурство</h2><div class="dts">`;
const dz=S.dezh||{};
h+=dzDates().map(d=>{const l=dz[d]||[];let c=`<div class="dt ${d===today?'nx':''}"><h4><span>${wd(d)}, ${fmt(d)}</span><span class="em">${d===today?'сегодня':''}</span></h4>${l.length?l.map(n=>'<span class="chip">'+n+'</span>').join(''):'<span class="em">никто не назначен</span>'}${owner?'<div><button class="ed" data-a="zopen" data-d="'+d+'">'+(openZ===d?'Закрыть':'Изменить')+'</button></div>':''}`;
if(owner&&openZ===d)c+='<div class="pick">'+ppl.map((p,i)=>`<button class="${l.includes(p.n)?'on':''}" data-a="ztog" data-d="${d}" data-i="${i}">${p.n}</button>`).join('')+'</div>';
return c+'</div>'}).join('')+'</div>';
if(owner&&(dirty||err||ok))h+=`<div class="save"><span>${err||ok||'Есть несохранённые изменения'}</span>${dirty?'<button data-a="save">'+(saving?'Сохранение…':'Сохранить')+'</button>':''}</div>`;
h+=`<p class="em" style="text-align:center;margin-top:30px"><a href="#" data-a="${owner?'logout':'login'}">${owner?'Выйти из редактора':'Вход для редактора'}</a></p>`;
app.innerHTML=h}
function repo(){let r=location.hostname.endsWith('github.io')&&location.pathname.split('/')[1]?location.hostname.split('.')[0]+'/'+location.pathname.split('/')[1]:LS.getItem('duty_repo');
if(!r){r=prompt('Репозиторий в формате логин/имя-репозитория');if(r)LS.setItem('duty_repo',r.trim())}return r&&r.trim()}
async function save(){const r=repo(),t=LS.getItem('duty_token');if(!r){err='Не указан репозиторий';return render()}
saving=true;err=ok='';render();
for(const d in S.dezh||{})if(d<today)delete S.dezh[d];
try{const u='https://api.github.com/repos/'+r+'/contents/data.json',h={Authorization:'Bearer '+t,Accept:'application/vnd.github+json'};
const g=await fetch(u,{headers:h});if(!g.ok)throw new Error('чтение, код '+g.status);const sha=(await g.json()).sha;
const p=await fetch(u,{method:'PUT',headers:h,body:JSON.stringify({message:'Обновление нарядов',content:btoa(unescape(encodeURIComponent(JSON.stringify(S,null,1)))),sha})});
if(!p.ok)throw new Error('запись, код '+p.status);dirty=false;ok='Сохранено. У остальных сайт обновится примерно через минуту.'}catch(x){err='Не сохранено: '+x.message}
saving=false;render()}
document.getElementById('app').addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(!b)return;e.preventDefault();const a=b.dataset.a;
if(a==='login'){const t=prompt('Вставьте GitHub-токен (хранится только в этом браузере)');if(t){LS.setItem('duty_token',t.trim());owner=true}}
else if(a==='logout'){LS.removeItem('duty_token');owner=false}
else if(!owner)return;
else if(a==='open')openD=openD===b.dataset.d?null:b.dataset.d;
else if(a==='tog'){const d=b.dataset.d,n=S.people[+b.dataset.i].n,l=S.duty[d]||(S.duty[d]=[]),k=l.indexOf(n);k<0?l.push(n):l.splice(k,1);if(!l.length)delete S.duty[d];dirty=true;ok=''}
else if(a==='ex'){const p=S.people[+b.dataset.i];if(p.ex)delete p.ex;else{p.ex=1;for(const d in S.duty){S.duty[d]=S.duty[d].filter(x=>x!==p.n);if(!S.duty[d].length)delete S.duty[d]}}dirty=true;ok=''}
else if(a==='del'){const p=S.people[+b.dataset.i];if(!confirm('Удалить '+p.n+' из списка?'))return;S.people.splice(+b.dataset.i,1);for(const d in S.dezh||{}){S.dezh[d]=S.dezh[d].filter(x=>x!==p.n);if(!S.dezh[d].length)delete S.dezh[d]}for(const d in S.duty){S.duty[d]=S.duty[d].filter(x=>x!==p.n);if(!S.duty[d].length)delete S.duty[d]}dirty=true;ok=''}
else if(a==='add'){const v=document.getElementById('np').value.trim();if(!v||S.people.some(p=>p.n===v))return;S.people.push({n:v});dirty=true;ok=''}
else if(a==='zopen')openZ=openZ===b.dataset.d?null:b.dataset.d;
else if(a==='ztog'){const d=b.dataset.d,n=S.people[+b.dataset.i].n,z=S.dezh||(S.dezh={}),l=z[d]||(z[d]=[]),k=l.indexOf(n);k<0?l.push(n):l.splice(k,1);if(!l.length)delete z[d];dirty=true;ok=''}
else if(a==='save'){save();return}
render()});
document.getElementById('app').addEventListener('change',e=>{const t=e.target;if(!owner||!t.dataset.f)return;const p=S.people[+t.dataset.i];if(t.dataset.f==='oc'){const b=(t.value===''?calc()[p.n].c0:Math.max(0,parseInt(t.value)||0))-calc()[p.n].c0;if(b)p.b=b;else delete p.b}
else{const nv=t.value||null,old=t.defaultValue,nm=p.n;delete p.ol;
if(old&&old!==nv&&S.duty[old]){S.duty[old]=S.duty[old].filter(x=>x!==nm);if(!S.duty[old].length)delete S.duty[old]}
if(nv){const l=S.duty[nv]||(S.duty[nv]=[]);if(!l.includes(nm))l.push(nm)}}dirty=true;ok='';render()});
render();
fetch('data.json?'+Date.now()).then(r=>r.json()).then(d=>{S=d;migrate();render()}).catch(()=>{document.getElementById('app').textContent='Не удалось загрузить data.json (откройте сайт по адресу GitHub Pages, а не как файл).'});
</script></body></html>
